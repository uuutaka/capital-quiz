<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f3f6fb">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="首都クイズ">
<title>首都クイズ</title>
<style>
:root{--bg:#e7eaee;--card:#f4f5f7;--ink:#172033;--muted:#667085;--line:#d9e0ea;--accent:#2457d6;--accent2:#173d98;--soft:#edf3ff;--shadow:0 12px 32px rgba(23,32,51,.10);--radius:22px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;-webkit-text-size-adjust:100%}button,input,select{font:inherit}button{touch-action:manipulation}.app{max-width:760px;margin:0 auto;padding:16px 14px calc(28px + env(safe-area-inset-bottom))}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 2px 16px}h1{font-size:clamp(25px,6vw,34px);margin:0;line-height:1.15}.badge{font-size:12px;font-weight:800;background:var(--soft);color:var(--accent2);padding:8px 11px;border-radius:999px;white-space:nowrap}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:var(--shadow)}.lead{font-size:14px;line-height:1.7;color:var(--muted);margin:0 0 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:800;color:#475467;margin:0 0 7px}select,input{width:100%;height:48px;border:1px solid #cfd7e4;border-radius:12px;background:#fff;color:var(--ink);font-size:16px;padding:0 12px;outline:none}select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(36,87,214,.12)}.actions{display:flex;gap:10px;margin-top:17px}button{border:0;border-radius:13px;min-height:50px;padding:0 16px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#fff;flex:1}.primary:active{background:var(--accent2)}.secondary{background:#e9eef6;color:#344054}.hidden{display:none!important}.quiz-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin:3px 2px 10px}.quiz-meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px;min-width:0;flex:1}.progress-label{font-size:13px;font-weight:850;color:#344054;text-align:right}.top-home-btn{background:#fff;border:1px solid var(--line);color:#475467;min-height:42px;padding:0 14px;white-space:nowrap;flex:0 0 auto}.progress-track{height:6px;background:#e2e7ef;border-radius:999px;overflow:hidden;margin-bottom:14px}.progress-bar{height:100%;background:var(--accent);width:0;transition:width .18s ease}.scene{min-height:min(58vh,520px);height:min(58vh,520px);touch-action:pan-y;-webkit-tap-highlight-color:transparent}.card{position:relative;width:100%;height:100%;cursor:pointer;-webkit-tap-highlight-color:transparent}.face{position:absolute;inset:0;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;padding:22px 20px;overflow:auto}.back{display:none;background:var(--card)}.card.flipped .front{display:none}.card.flipped .back{display:flex}.face-label{font-size:12px;font-weight:850;color:var(--accent2);background:var(--soft);padding:6px 10px;border-radius:999px;align-self:flex-start}.face-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 0;text-align:center}.prompt{font-size:16px;font-weight:750;color:var(--muted);margin-bottom:20px}.country{font-size:clamp(32px,9vw,54px);font-weight:900;line-height:1.35;overflow-wrap:anywhere}.country-flag{display:block;width:min(78vw,390px);height:240px;object-fit:contain;background:var(--card);filter:none;margin-top:20px;user-select:none;-webkit-user-drag:none}.capital{font-size:clamp(34px,9vw,58px);font-weight:900;line-height:1.35;overflow-wrap:anywhere}.note{margin-top:24px;font-size:14px;line-height:1.7;color:var(--muted);max-width:560px}.nav{position:sticky;bottom:max(8px,env(safe-area-inset-bottom));z-index:5;padding-top:12px;background:linear-gradient(to bottom,rgba(243,246,251,0),var(--bg) 30%)}.nav-row{display:grid;grid-template-columns:1fr 1.45fr;gap:10px}.flip-btn{width:100%;margin-bottom:10px;background:#fff;border:1px solid #bfc9d8;color:var(--accent2)}.finish-panel h2{margin:0 0 8px;font-size:27px}.finish-panel p{margin:0;color:var(--muted);line-height:1.7}
@media(max-width:560px){.app{padding:12px 11px calc(22px + env(safe-area-inset-bottom))}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.scene{height:58vh;min-height:390px;max-height:560px}.face{padding:18px 16px}.country{font-size:38px}.capital{font-size:40px}.nav-row{grid-template-columns:1fr 1.45fr}}
@media(max-width:560px){.country-flag{width:min(82vw,390px);height:230px}}
@media(max-height:700px) and (max-width:560px){.scene{height:52vh;min-height:330px}.face-body{padding:10px 0}.country-flag{width:min(74vw,340px);height:185px;margin-top:12px}}
</style>
</head>
<body>
<div class="app">
<header><h1>首都クイズ</h1><div id="totalBadge" class="badge">読み込み中</div></header>
<section id="setup" class="panel">
<p class="lead">国名と国旗を見て首都名を思い出し、カードをタップまたは「答えを見る」で確認します。</p>
<div class="grid">
 <div class="field"><label for="region">地域</label><select id="region"><option value="" selected>全部</option><option value="ヨーロッパ">ヨーロッパ</option><option value="アジア">アジア</option><option value="南北アメリカ">南北アメリカ</option><option value="アフリカ">アフリカ</option><option value="オセアニア">オセアニア</option></select></div>
 <div class="field"><label for="count">カード枚数</label><select id="count"><option value="5">5枚</option><option value="10">10枚</option><option value="20">20枚</option><option value="30">30枚</option><option value="50">50枚</option><option value="all" selected>全部</option></select></div>
 <div class="field"><label for="order">出題順</label><select id="order"><option value="random" selected>ランダム</option><option value="sequential">順番</option></select></div>
 <div class="field full"><label for="keyword">キーワード（任意）</label><input id="keyword" type="search" placeholder="国名または首都名" autocomplete="off"></div>
</div>
<div class="actions"><button id="startBtn" class="primary" type="button" disabled>カードを開始</button></div>
<p id="dataStatus" class="lead" style="margin-top:13px;margin-bottom:0">データを読み込んでいます。</p>
</section>
<section id="quiz" class="hidden">
 <div class="quiz-top"><button id="homeBtn" class="top-home-btn" type="button">← ホーム</button><div class="quiz-meta"><div id="progressLabel" class="progress-label"></div></div></div>
 <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
 <div class="scene"><div id="card" class="card">
  <div class="face front"><div class="face-label">問題</div><div class="face-body"><div class="prompt">首都名を答えなさい</div><div id="countryText" class="country"></div><img id="countryFlag" class="country-flag" alt="問題の国旗"></div></div>
  <div class="face back"><div class="face-label">答え</div><div class="face-body"><div id="capitalText" class="capital"></div><div id="noteText" class="note hidden"></div></div></div>
 </div></div>
 <div class="nav"><button id="flipBtn" class="flip-btn" type="button">答えを見る</button><div class="nav-row"><button id="prevBtn" class="secondary" type="button">前へ</button><button id="nextBtn" class="primary" type="button">次へ</button></div></div>
</section>
<section id="finish" class="panel finish-panel hidden"><h2>終了</h2><p id="finishText"></p><div class="actions"><button id="againBtn" class="secondary" type="button">同じ条件でもう一度</button><button id="settingsBtn" class="primary" type="button">設定に戻る</button></div></section>
</div>
<script>
let DATA=[]; const $=id=>document.getElementById(id); const el={setup:$('setup'),quiz:$('quiz'),finish:$('finish'),region:$('region'),count:$('count'),order:$('order'),keyword:$('keyword'),start:$('startBtn'),card:$('card'),country:$('countryText'),flag:$('countryFlag'),capital:$('capitalText'),note:$('noteText'),progress:$('progressLabel'),bar:$('progressBar'),flip:$('flipBtn'),prev:$('prevBtn'),next:$('nextBtn'),home:$('homeBtn'),again:$('againBtn'),settings:$('settingsBtn'),finishText:$('finishText'),badge:$('totalBadge'),status:$('dataStatus')}; let session=null;
async function loadData(){try{const r=await fetch('./capitals.json',{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);const p=await r.json();DATA=p.countries||[];if(!DATA.length)throw new Error('empty');el.badge.textContent=`全 ${DATA.length} 問`;el.status.textContent=`首都データを読み込みました（${DATA.length}問）`;el.start.disabled=false}catch(e){console.error(e);el.badge.textContent='読込エラー';el.status.textContent='capitals.json を読み込めませんでした。';}}
function pool(){const region=el.region.value,k=el.keyword.value.trim().toLowerCase();return DATA.filter(x=>(!region||x.region===region)&&(!k||(x.country+' '+x.capital+' '+(x.note||'')).toLowerCase().includes(k)))}function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function selected(){let a=pool();if(el.order.value==='random')a=shuffle(a);const n=el.count.value==='all'?a.length:Math.min(+el.count.value,a.length);return a.slice(0,n)}
function start(){const cards=selected();if(!cards.length){alert('条件に一致するカードがありません。');return}session={cards,index:0};el.setup.classList.add('hidden');el.finish.classList.add('hidden');el.quiz.classList.remove('hidden');render();scrollToTop()}function scrollToTop(){window.scrollTo({top:0,behavior:'smooth'})}function isFlipped(){return el.card.classList.contains('flipped')}function setFlip(v){el.card.classList.toggle('flipped',v);el.flip.textContent=v?'問題に戻る':'答えを見る'}function toggleFlip(){setFlip(!isFlipped())}
function flagSvgUrl(x){return `https://flagcdn.com/${String(x.code).toLowerCase()}.svg`}
function flagPngUrl(x){return `https://flagcdn.com/w320/${String(x.code).toLowerCase()}.png`}
function setFlag(x){
  el.flag.onerror=null;
  el.flag.dataset.fallback='0';
  el.flag.alt=`${x.country}の国旗`;
  el.flag.onerror=()=>{
    if(el.flag.dataset.fallback==='0'){
      el.flag.dataset.fallback='1';
      el.flag.src=flagPngUrl(x);
    }else{
      el.flag.onerror=null;
    }
  };
  el.flag.src=flagSvgUrl(x);
}
function render(){const x=session.cards[session.index],i=session.index,n=session.cards.length;setFlip(false);el.country.textContent=x.country;setFlag(x);el.capital.textContent=x.capital;el.note.textContent=x.note||'';el.note.classList.toggle('hidden',!x.note);el.progress.textContent=`${i+1} / ${n} 枚`;el.bar.style.width=`${(i+1)/n*100}%`;el.prev.disabled=i===0;el.next.textContent=i===n-1?'終了':'次へ'}function prev(){if(session.index>0){session.index--;render();scrollToTop()}}function next(){if(session.index<session.cards.length-1){session.index++;render();scrollToTop()}else finish()}function home(){session=null;setFlip(false);el.quiz.classList.add('hidden');el.finish.classList.add('hidden');el.setup.classList.remove('hidden');scrollToTop()}function finish(){el.quiz.classList.add('hidden');el.finish.classList.remove('hidden');el.finishText.textContent=`${session.cards.length}枚のカードを確認しました。`;scrollToTop()}function again(){let cards=selected();if(!cards.length)return;session={cards,index:0};el.finish.classList.add('hidden');el.quiz.classList.remove('hidden');render();scrollToTop()}function settings(){el.finish.classList.add('hidden');el.quiz.classList.add('hidden');el.setup.classList.remove('hidden');scrollToTop()}
el.start.addEventListener('click',start);
// iPhone/PWAで確実に動かすため、3D反転ではなく、表示中の面を直接タップして切り替える。
const frontFace=el.card.querySelector('.front');
const backFace=el.card.querySelector('.back');
frontFace.addEventListener('click',toggleFlip);
backFace.addEventListener('click',toggleFlip);
// キーボード操作にも対応。
el.card.tabIndex=0;
el.card.setAttribute('role','button');
el.card.setAttribute('aria-label','タップして問題と答えを切り替え');
el.card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleFlip();}});
el.flip.addEventListener('click',toggleFlip);el.prev.addEventListener('click',prev);el.next.addEventListener('click',next);el.home.addEventListener('click',home);el.again.addEventListener('click',again);el.settings.addEventListener('click',settings);el.keyword.addEventListener('keydown',e=>{if(e.key==='Enter'&&!el.start.disabled)start()});loadData();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));}</script>
</body></html>
